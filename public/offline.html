<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão · Medo de Dirigir Nunca Mais</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:'Lexend',system-ui,sans-serif;color:#EAF0FA;
       background:radial-gradient(120% 80% at 50% -10%,#12294d 0%,#0B1A38 55%)}
  .box{max-width:340px;text-align:center}
  .emoji{font-size:52px}
  h1{font-size:20px;font-weight:900;margin:12px 0 6px}
  p{font-size:14px;color:#AEC0DC;line-height:1.55;margin:0 0 22px}
  button{font-family:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:12px;
         background:#FFD60A;color:#0B1A38;border:0;padding:14px 24px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">📡</div>
    <h1>Você está sem internet</h1>
    <p>Suas aulas precisam de conexão pra carregar. Assim que o sinal voltar, é só tocar no botão abaixo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
